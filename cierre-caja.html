<style>
:root{ --bg:#0c1f14;--surface:#12291b;--surface2:#183322;--line:#264530;--text:#eef5ea;--muted:#9fb8a5; --accent:#f5b301;--accent-ink:#1c1400;--accent-text:#ffd34d; --good:#5ee08f;--good-bg:rgba(94,224,143,.13);--warn:#ffc94d;--warn-bg:rgba(255,201,77,.13);--bad:#ff7a6b;--bad-bg:rgba(255,122,107,.14); --c1:#f5b301;--c2:#5ee08f;--c3:#ff8a3d;--c4:#7cc4ff;--c5:#e86bd0;--c6:#c9d4c3;color-scheme:dark; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:110px}
button{font:inherit;cursor:pointer}
.num,.money,.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* encabezado */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:auto;padding:10px 16px 6px;display:flex;align-items:center;gap:12px}
.top-in img{width:42px;height:42px;object-fit:contain;flex:none}
.brand{min-width:0}
.brand b{display:block;font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-size:12px}
.adminbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.adminbtn .s{display:none}@media (max-width:480px){.adminbtn .s{display:inline}}
.adminbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
@media (max-width:480px){.tab .lg{display:none}nav .tab{padding:9px 6px;font-size:13.5px}.adminbtn .t{display:none}}
body.adm .tab .lk{display:none}
nav.tabs{max-width:780px;margin:auto;display:flex;gap:4px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
@media (max-width:340px){.kpis{grid-template-columns:1fr}.den-h,.den-r{grid-template-columns:58px 1fr 1fr 74px;gap:5px}.den-r b{font-size:12.5px}}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--surface2);color:var(--text)}
main{max-width:780px;margin:auto;padding:16px}

/* tarjetas y campos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:9px;font-weight:800}
.step{background:var(--accent);color:var(--accent-ink);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;letter-spacing:0;flex:none}
h3.sub{font-size:13px;margin:18px 0 8px;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3>.wide{grid-column:1/-1}}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:700;min-width:0}
label.f small,.hint{font-weight:500;color:var(--muted);font-size:12px}
.hint{margin:10px 0 0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;min-height:46px;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input:disabled{opacity:.65}
input.money{text-align:right;font-weight:500}
input[type=number]{text-align:right;font-family:'JetBrains Mono',monospace}
.btn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:11px 16px;font-weight:700;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.x{border:0;background:transparent;color:var(--muted);width:40px;height:46px;font-size:20px;border-radius:10px;flex:none}
.x:hover{color:var(--bad);background:var(--surface2)}

/* fondo fijo */
.fondo{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:6px}
.fondo .ic{font-size:20px}
.fondo b{font-size:18px}
.fondo small{display:block;color:var(--muted);font-size:12px}
.fondo .v{margin-left:auto;text-align:right}

/* conteo */
.den{margin-top:14px}
.den-h,.den-r{display:grid;grid-template-columns:76px 1fr 1fr minmax(84px,1fr);gap:8px;align-items:center}
.den-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:0 2px 6px}
.den-h span:nth-child(n+2){text-align:right}
.den-r{padding:3px 0}
.den-r .dn{font-weight:800;font-size:15px}
.den-r b{text-align:right;font-size:14px}
.den-r b.zero{color:var(--muted);font-weight:500}
.den-r input{min-height:42px;padding:8px 10px}
.sumline{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:700}
.sumline.big{font-size:17px}
.sumline.big b{font-size:20px;color:var(--accent-text)}

/* filas dinámicas */
.lrow{display:grid;grid-template-columns:1.1fr 1.4fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.arow{display:grid;grid-template-columns:1.3fr 1fr 64px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:560px){
 .lrow{grid-template-columns:1fr 1fr auto}
 .lrow .desc{grid-column:1/-1;grid-row:2}
 .arow{grid-template-columns:1fr 1fr 64px}
 .arow .money{grid-column:1/3}
}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700}
.tarifas{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;margin-bottom:14px}
.tarifas>span{font-size:12px;color:var(--muted);font-weight:800;text-align:center}
.tarifas b{font-size:14px;padding-right:6px}
.tarifas .chip{font-family:'JetBrains Mono',monospace;min-height:44px}
.chip small{color:var(--muted);font-weight:600;margin-left:4px}
.chip:active{transform:scale(.97)}

/* resultado */
.result .rows>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.result .rows>div span{color:var(--muted)}
.result .rows>div b{font-size:15px}
.difbox{margin:14px 0 4px;border-radius:16px;padding:16px;text-align:center;background:var(--surface2)}
.difbox .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.difbox .val{font-size:34px;font-weight:700;line-height:1.15;margin-top:4px}
.difbox.ok{background:var(--good-bg);color:var(--good)}
.difbox.sob{background:var(--warn-bg);color:var(--warn)}
.difbox.fal{background:var(--bad-bg);color:var(--bad)}
details.how{margin-top:10px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:700}
details.how div{display:flex;justify-content:space-between;padding:3px 0}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:780px;margin:auto;display:flex;align-items:center;gap:12px}
.bar .st{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.bar .sv{font-size:20px;font-weight:700}
.bar .btn{margin-left:auto;padding:12px 22px}
.c-ok{color:var(--good)}.c-sob{color:var(--warn)}.c-fal{color:var(--bad)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner .btn{margin-left:auto}

/* historial */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{width:auto;flex:1;min-width:160px}
.hitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--text)}
.hitem .d{flex:none;width:46px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.hitem .d b{display:block;font-size:20px;line-height:1}
.hitem .d small{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.hitem .m{min-width:0;flex:1}
.hitem .m b{display:block}
.hitem .m small{color:var(--muted)}
.hitem .r{text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;margin-top:3px}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.sob{background:var(--warn-bg);color:var(--warn)}.pill.fal{background:var(--bad-bg);color:var(--bad)}
.lock{font-size:12px;color:var(--muted)}

/* resumen */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-size:clamp(16px,5vw,22px);overflow-wrap:anywhere;margin-top:4px;line-height:1.2}
.kpi small{font-size:12px;color:var(--muted)}
.kpi .up{color:var(--good)}.kpi .down{color:var(--bad)}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface2);margin-bottom:12px}
.stack i{display:block;height:100%}
.mrow{display:grid;grid-template-columns:14px 1fr auto 52px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mrow .dot{width:12px;height:12px;border-radius:4px}
.mrow .p{text-align:right;color:var(--muted);font-size:13px}
.days{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:8px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.days i{display:block;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.days i.none{background:transparent}
.days div:hover i{opacity:.75}
.dlabels{display:flex;gap:2px;margin-top:4px}
.dlabels span{flex:1;font-size:9.5px;color:var(--muted);text-align:center;min-width:0}
.wk{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.wk .tr{background:var(--surface2);border-radius:6px;height:16px;overflow:hidden}
.wk .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.wk b{font-size:13px;min-width:92px;text-align:right}
.note{font-size:12.5px;color:var(--muted)}

/* diálogo */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--text);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--muted)}
.dlg .btns{margin-top:16px;justify-content:flex-end}
.pinin{font-size:24px;letter-spacing:.4em;text-align:center;font-family:'JetBrains Mono',monospace}
.err{color:var(--bad);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}

/* recibo */
.rc{font-size:14px}
.rc-h{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.rc-h img{width:48px;height:48px;object-fit:contain}
.rc-h b{display:block;font-size:16px}
.rc-h span{color:var(--muted);font-size:13px}
.rc-meta{color:var(--muted);font-size:13px;margin:10px 0}
.rc h4{margin:16px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.rl{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.rl b{font-family:'JetBrains Mono',monospace;font-weight:500;white-space:nowrap}
.rl.sub{color:var(--muted);border-top:1px dashed var(--line)}
.rl.tot{font-weight:800;border-top:1px solid var(--line);padding-top:6px}
.rl.tot b{font-weight:700}
.rl.dif.ok b{color:var(--good)}.rl.dif.sob b{color:var(--warn)}.rl.dif.fal b{color:var(--bad)}
.rc .notes{background:var(--surface2);border-radius:10px;padding:10px;margin-top:8px;white-space:pre-wrap}
.rc .edits{font-size:12px;color:var(--warn);margin-top:10px}
.firmas{display:none}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;transition:.25s;max-width:calc(100vw - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#print{display:none}
@media print{
 @page{margin:12mm}
 body{background:#fff;color:#000;padding:0}
 body>*:not(#print){display:none!important}
 #print{display:block;color:#000}
 #print *{color:#000!important;background:transparent!important}
 #print .rc{font-size:12px;max-width:520px;margin:auto}
 #print .firmas{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:50px}
 #print .firmas div{border-top:1px solid #000;padding-top:4px;text-align:center;font-size:11px}
 #print .days i,#print .wk .tr i,#print .stack i{background:#555!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 #print .card{border:1px solid #ccc;break-inside:avoid}
}
</style>

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const K = k => 'cc_' + CFG.id + '_' + k;
function load(k, d) { try { const v = localStorage.getItem(K(k)); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function store(k, v) { try { localStorage.setItem(K(k), JSON.stringify(v)); return true; } catch (e) { toast('No se pudo guardar en este dispositivo'); return false; } }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const miles = n => Math.round(Math.abs(+n || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fmt = n => ((+n || 0) < -0.5 ? '−' : '') + '₡' + miles(n);
const signed = n => (n > 0.5 ? '+' : n < -0.5 ? '−' : '') + '₡' + miles(n);
function parseCol(s) { s = String(s ?? '').replace(/[^\d,.\-]/g, '').replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function hoy() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const D = f => new Date(f + 'T12:00:00');
const fechaLarga = f => { const s = D(f).toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); };
const mesLargo = m => { const s = new Date(m + '-15T12:00:00').toLocaleDateString('es-CR', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); };
function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => { if (a[k] == null || typeof a[k] !== 'object') a[k] = {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

const DEN_M = [5, 10, 25, 50, 100, 500], DEN_B = [1000, 2000, 5000, 10000, 20000, 50000];
const CANCHAS = CFG.modo === 'canchas';

/* ---------- estado ---------- */
let S = Object.assign({ fondo: CFG.fondoDefault, tolerancia: 500, tc: CFG.tcDefault, pin: null, salt: null, alg: null, cajeros: [] }, load('cfg', {}));
S.tarifas = Object.assign({}, CFG.tarifas || {}, S.tarifas || {});
let cierres = load('cierres', []);
let audit = load('audit', []);
let admin = false, adminT = null, tabActual = 'cierre';
const saveCfg = () => store('cfg', S);
const saveCierres = () => store('cierres', cierres);

function nuevo() {
  return { id: null, fecha: hoy(), turno: CFG.turnos[0], cajero: '', fondo: S.fondo, conteo: {}, usd: '', tc: S.tc,
    medios: {}, abonos: 0, salidas: [], ventas: 0, alquileres: [], extra: {}, notas: '' };
}
let draft = load('draft', null) || nuevo();
let F = draft; // formulario actual (borrador o cierre en edición)

function normalizarBorrador() {
  if (F.id) return;
  F.fondo = S.fondo;                 // el fondo siempre es el fijo
  if (!admin) F.fecha = hoy();       // el cajero solo cierra el día de hoy
}

/* ---------- cálculo (misma lógica que la hoja de Excel) ---------- */
function calc(c) {
  let monedas = 0, billetes = 0;
  const cn = c.conteo || {};
  DEN_M.forEach(d => { const r = cn[d] || {}; monedas += d * (+r.c || 0) + (+r.m || 0); });
  DEN_B.forEach(d => { const r = cn[d] || {}; billetes += d * (+r.c || 0) + (+r.m || 0); });
  const dol = (+c.usd || 0) * (+c.tc || 0);
  const efectivo = monedas + billetes + dol;
  const medios = {}; let noEf = 0;
  CFG.medios.forEach(m => { medios[m.id] = +(c.medios || {})[m.id] || 0; noEf += medios[m.id]; });
  const salTipo = {}; let sal = 0;
  (c.salidas || []).forEach(s => { const v = +s.monto || 0; sal += v; salTipo[s.tipo] = (salTipo[s.tipo] || 0) + v; });
  let ventas, alq = 0; const extra = {};
  if (CANCHAS) {
    alq = (c.alquileres || []).reduce((a, r) => a + (+r.monto || 0), 0);
    ventas = alq;
    (CFG.ventasExtra || []).forEach(x => { extra[x.id] = +(c.extra || {})[x.id] || 0; ventas += extra[x.id]; });
  } else ventas = +c.ventas || 0;
  const abonos = CFG.abonos ? (+c.abonos || 0) : 0;
  const fondo = +c.fondo || 0;
  const esperado = fondo + ventas - noEf + abonos - sal;
  const dif = efectivo - esperado;
  return { monedas, billetes, dol, efectivo, medios, noEf, salTipo, sal, ventas, alq, extra, abonos, fondo, esperado, dif,
    entregar: efectivo - fondo, ventasEf: ventas - noEf };
}
function estado(dif) {
  if (Math.abs(dif) <= (+S.tolerancia || 0)) return { k: 'ok', txt: 'Cuadrada' };
  return dif > 0 ? { k: 'sob', txt: 'Sobrante' } : { k: 'fal', txt: 'Faltante' };
}

  const set = (id, v) => { const el = $('#' + id); if (el) { if (el.tagName === 'INPUT') el.value = v; else el.textContent = v; } };
  set('o-mon', fmt(t.monedas)); set('o-bil', fmt(t.billetes)); set('o-dol', fmt(t.dol)); set('o-ef', fmt(t.efectivo));
  set('o-noef', fmt(t.noEf)); set('o-sal', fmt(t.sal)); set('o-ven', fmt(t.ventas)); set('o-alq', fmt(t.alq));

async function guardar() {
  const t = calc(F), st = estado(t.dif);
  if (!String(F.cajero).trim()) { toast('Escriba el nombre de quien hace el cierre'); $('[data-b="cajero"]').focus(); return; }
  if (t.ventas <= 0 && !(await confirmar('Ventas en cero', 'No hay ventas registradas. ¿Guardar el cierre así?', 'Guardar igual'))) return;
  if (st.k !== 'ok' && !String(F.notas).trim()) {
    toast(`Hay un ${st.txt.toLowerCase()} de ${fmt(t.dif)}. Explique en Observaciones qué pasó.`);
    const n = $('[data-b="notas"]'); n.scrollIntoView({ behavior: 'smooth', block: 'center' }); n.focus(); return;
  }
  if (F.id) { // edición del administrador
    if (!admin) { toast('La sesión de administrador se cerró'); return; }
    const motivo = await pedirTexto('Motivo del cambio', 'Queda registrado en el historial del cierre.', 'Ej: faltó anotar un SINPE');
    if (!motivo) return;
    const i = cierres.findIndex(c => c.id === F.id);
    const antes = calc(cierres[i]);
    F.editado = (F.editado || []).concat({ cuando: new Date().toISOString(), motivo, antes: { ventas: antes.ventas, dif: antes.dif } });
    cierres[i] = JSON.parse(JSON.stringify(F));
    audit.unshift({ cuando: new Date().toISOString(), accion: 'Editó', fecha: F.fecha, turno: F.turno, motivo }); store('audit', audit);
    saveCierres(); const id = F.id; F = draft; renderCierre(); toast('Cambios guardados'); verCierre(id); return;
  }
  const dup = cierres.find(c => c.fecha === F.fecha && c.turno === F.turno);
  if (dup) { toast(`Ya existe un cierre del ${F.fecha} para "${F.turno}". Elija otro turno o pida al administrador que lo edite.`); return; }
  const ok = await confirmar('¿Guardar el cierre?', `${st.txt}: ${signed(t.dif)}. Una vez guardado ya no se puede modificar sin la clave del administrador.`, 'Sí, guardar');
  if (!ok) return;
  const c = JSON.parse(JSON.stringify(F));
  c.id = uid(); c.creado = new Date().toISOString(); c.fondo = S.fondo;
  cierres.push(c); if (!saveCierres()) { cierres.pop(); return; }
  const nom = String(c.cajero).trim();
  if (nom && !S.cajeros.includes(nom)) { S.cajeros.push(nom); saveCfg(); llenarCajeros(); }
  const turno = F.turno, caj = F.cajero;
  draft = nuevo(); draft.cajero = caj;
  draft.turno = turno;
  F = draft; store('draft', null); renderCierre();
  window.scrollTo({ top: 0 });
  verCierre(c.id, true);
}

/* ---------- administrador (clave) ---------- */
async function hashPin(pin, salt, alg) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (alg === 'sha') { const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 2166136261; for (let r = 0; r < 5000; r++) for (const x of data) { h ^= x; h = Math.imul(h, 16777619); } return (h >>> 0).toString(16);
}
let fallos = 0, bloqueoHasta = 0;
function pedirAdmin() {
  return new Promise(res => {
    if (admin) return res(true);
    const crear = !S.pin;
    abrir(crear ? `<h3>Crear clave de administrador</h3>
      <p>Con esta clave usted cambia el fondo de caja, edita días anteriores y ve el resumen mensual. Anótela en un lugar seguro: no se puede recuperar.</p>
      <label class="f">Clave nueva (mínimo 4 números)<input class="pinin" id="p1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12"></label>
      <label class="f" style="margin-top:10px">Repita la clave<input class="pinin" id="p2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12"></label>
      <label class="f" style="margin-top:10px">Fondo de caja fijo<input class="money" id="p3" inputmode="numeric" value="${miles(S.fondo)}"></label>
      <div class="err" id="pe"></div>
      <div class="btns"><button class="btn" type="button" id="pn">Cancelar</button><button class="btn pri" type="button" id="ps">Crear clave</button></div>`
      : `<h3>Clave de administrador</h3><p>Solo el dueño puede entrar aquí.</p>
      <input class="pinin" id="p1" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="Clave">
      <div class="err" id="pe"></div>
      <div class="btns"><button class="btn" type="button" id="pn">Cancelar</button><button class="btn pri" type="button" id="ps">Entrar</button></div>`);
    let hecho = false;
    const fin = v => { if (hecho) return; hecho = true; cerrar(); res(v); };
    const go = async () => {
      const p1 = $('#p1').value.trim();
      if (crear) {
        if (!/^\d{4,12}$/.test(p1)) { $('#pe').textContent = 'Use de 4 a 12 números'; return; }
        if (p1 !== $('#p2').value.trim()) { $('#pe').textContent = 'Las claves no coinciden'; return; }
        S.salt = uid(); S.alg = (window.crypto && crypto.subtle) ? 'sha' : 'fnv'; S.pin = await hashPin(p1, S.salt, S.alg);
        const f = parseCol($('#p3').value); if (f >= 0) S.fondo = f;
        saveCfg(); entrarAdmin(); toast('Clave creada'); fin(true); return;
      }
      if (Date.now() < bloqueoHasta) { $('#pe').textContent = 'Demasiados intentos. Espere un minuto.'; return; }
      if (S.alg === 'sha' && !(window.crypto && crypto.subtle)) { $('#pe').textContent = 'Abra la app desde la dirección web segura (https) para usar la clave.'; return; }
      if (await hashPin(p1, S.salt, S.alg) === S.pin) { fallos = 0; entrarAdmin(); fin(true); }
      else { fallos++; $('#p1').value = ''; $('#pe').textContent = 'Clave incorrecta'; if (fallos >= 5) { bloqueoHasta = Date.now() + 60000; fallos = 0; $('#pe').textContent = 'Demasiados intentos. Espere un minuto.'; } }
    };
    $('#ps').onclick = go; $('#pn').onclick = () => fin(false);
    $$('#dlg-in input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
    dlg.onclose = () => fin(false);
    setTimeout(() => $('#p1').focus(), 50);
  });
}
function entrarAdmin() { admin = true; tocarAdmin(); pintarAdmin(); if (!F.id) renderCierre(); }
function salirAdmin(msg) {
  admin = false; clearTimeout(adminT);
  if (F.id) F = draft;
  pintarAdmin(); renderCierre();
  if (tabActual === 'resumen' || tabActual === 'ajustes') irA('cierre');

/* ---------- recibo, compartir, imprimir ---------- */
function recibo(c) {
  const t = calc(c), st = estado(t.dif);
  const L = (a, b, cls = '') => `<div class="rl ${cls}"><span>${a}</span><b>${b}</b></div>`;
  const den = lista => lista.filter(d => { const r = (c.conteo || {})[d] || {}; return (+r.c || 0) || (+r.m || 0); }).map(d => {
    const r = c.conteo[d]; const tot = d * (+r.c || 0) + (+r.m || 0);
    return L(`${fmt(d)}${+r.c ? ' × ' + r.c : ''}${+r.m ? (+r.c ? ' + ' : ' — monto ') + fmt(r.m) : ''}`, fmt(tot));
  }).join('');
  let h = `<div class="rc"><div class="rc-h"><img src="${CFG.logo}" alt=""><div><b>${esc(CFG.negocio)}</b><span>Cierre de caja</span></div></div>
  <div class="rc-meta">${esc(fechaLarga(c.fecha))} · ${esc(c.turno)}<br>Cajero(a): <b>${esc(c.cajero) || '—'}</b></div>
  <h4>Efectivo</h4>${den(DEN_M)}${L('Monedas', fmt(t.monedas), 'sub')}${den(DEN_B)}${L('Billetes', fmt(t.billetes), 'sub')}
  ${t.dol ? L(`Dólares US$${c.usd} × ${c.tc}`, fmt(t.dol)) : ''}${L('Total efectivo', fmt(t.efectivo), 'tot')}
  <h4>Cobros que no son efectivo</h4>${CFG.medios.map(m => L(esc(m.label), fmt(t.medios[m.id]))).join('')}
  ${CFG.abonos ? L('Abonos recibidos', fmt(t.abonos)) : ''}`;
  if ((c.salidas || []).length) h += `<h4>Salidas de caja</h4>${c.salidas.map(s => L(esc(s.tipo) + (s.desc ? ' — ' + esc(s.desc) : ''), fmt(+s.monto || 0))).join('')}${L('Total salidas', fmt(t.sal), 'sub')}`;
  h += `<h4>Ventas</h4>`;
  if (CANCHAS) {
    h += (c.alquileres || []).map(r => { const cc = CFG.canchas.find(x => x.id === r.cancha); return L(`${esc(cc ? cc.label : r.cancha)} · ${r.horario === 'noche' ? 'noche' : 'día'} · ${r.horas || 1} h`, fmt(+r.monto || 0)); }).join('');
    h += CFG.ventasExtra.map(x => t.extra[x.id] ? L(esc(x.label), fmt(t.extra[x.id])) : '').join('');
  }
  h += L('Ventas totales', fmt(t.ventas), 'tot');
  h += `<h4>Cuadre</h4>${L('Fondo de caja', fmt(t.fondo))}${L('Efectivo que debería haber', fmt(t.esperado))}${L('Efectivo contado', fmt(t.efectivo))}
  ${L('Diferencia (' + st.txt.toLowerCase() + ')', signed(t.dif), 'dif ' + st.k)}${L('Para entregar / depositar', fmt(t.entregar), 'tot')}`;
  if (c.notas) h += `<h4>Observaciones</h4><div class="notes">${esc(c.notas)}</div>`;
  if ((c.editado || []).length) h += `<div class="edits">${c.editado.map(e => `✏️ Editado por el administrador el ${new Date(e.cuando).toLocaleString('es-CR')} — ${esc(e.motivo)} (antes: ventas ${fmt(e.antes.ventas)}, diferencia ${signed(e.antes.dif)})`).join('<br>')}</div>`;
  h += `<div class="firmas"><div>Firma cajero(a)</div><div>Revisado por</div></div></div>`;
  return h;
}
function textoWhatsApp(c) {
  const t = calc(c), st = estado(t.dif);
  const ls = [`*Cierre de caja — ${CFG.negocio}*`, `${fechaLarga(c.fecha)} · ${c.turno}`, `Cajero(a): ${c.cajero || '—'}`, '',
    `Ventas totales: ${fmt(t.ventas)}`, `Efectivo contado: ${fmt(t.efectivo)}`];
  CFG.medios.forEach(m => { if (t.medios[m.id]) ls.push(`${m.label}: ${fmt(t.medios[m.id])}`); });
  if (t.abonos) ls.push(`Abonos: ${fmt(t.abonos)}`);
  if (t.sal) ls.push(`Salidas de caja: ${fmt(t.sal)}`);
  ls.push('', `*${st.txt}: ${signed(t.dif)}*`, `Para entregar: ${fmt(t.entregar)}`, `Fondo en caja: ${fmt(t.fondo)}`);
  if (c.notas) ls.push('', `Obs: ${c.notas}`);
  return ls.join('\n');
}
async function compartir(c) {
  const txt = textoWhatsApp(c);
  if (navigator.share) { try { await navigator.share({ text: txt }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
}
function imprimir(html) { $('#print').innerHTML = html; setTimeout(() => window.print(), 60); }

      if (!ok) return;

      cierres = cierres.filter(x => x.id !== c.id); saveCierres();

/* ---------- resumen mensual ---------- */
let mesRes = hoy().slice(0, 7);
const COLORES = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
function mesAnterior(m) { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function agregar(mes) {
  const lst = cierres.filter(c => c.fecha.startsWith(mes));
  const A = { n: lst.length, ventas: 0, ventasEf: 0, medios: {}, abonos: 0, sal: 0, salTipo: {}, sob: 0, fal: 0, nFal: 0, porDia: {}, alq: 0, extra: {}, canchas: {}, horario: { dia: { h: 0, m: 0 }, noche: { h: 0, m: 0 } }, faltantes: [] };
  CFG.medios.forEach(m => A.medios[m.id] = 0);
  lst.forEach(c => {
    const t = calc(c), st = estado(t.dif);
    A.ventas += t.ventas; A.ventasEf += t.ventasEf; A.abonos += t.abonos; A.sal += t.sal;
    CFG.medios.forEach(m => A.medios[m.id] += t.medios[m.id]);
    Object.entries(t.salTipo).forEach(([k, v]) => A.salTipo[k] = (A.salTipo[k] || 0) + v);
    if (t.dif > 0.5) A.sob += t.dif; if (t.dif < -0.5) A.fal += -t.dif;
    if (st.k === 'fal') { A.nFal++; A.faltantes.push({ c, dif: t.dif }); }
    A.porDia[c.fecha] = (A.porDia[c.fecha] || 0) + t.ventas;
    if (CANCHAS) {
      A.alq += t.alq; Object.entries(t.extra).forEach(([k, v]) => A.extra[k] = (A.extra[k] || 0) + v);
      (c.alquileres || []).forEach(r => { const k = r.cancha; A.canchas[k] = A.canchas[k] || { h: 0, m: 0 }; A.canchas[k].h += +r.horas || 0; A.canchas[k].m += +r.monto || 0;
        const hz = r.horario === 'noche' ? 'noche' : 'dia'; A.horario[hz].h += +r.horas || 0; A.horario[hz].m += +r.monto || 0; });
    }
  });
  A.dias = Object.keys(A.porDia).length;
  return A;
}
function renderResumen() {

  const pagos = [{ l: 'Efectivo', v: A.ventasEf }, ...CFG.medios.map(m => ({ l: m.label, v: A.medios[m.id] }))];
  const totPagos = pagos.reduce((a, p) => a + Math.max(0, p.v), 0) || 1;
  // ventas por día
  const [y, mm] = mesRes.split('-').map(Number); const nd = new Date(y, mm, 0).getDate();
  const vals = Array.from({ length: nd }, (_, i) => A.porDia[mesRes + '-' + String(i + 1).padStart(2, '0')] || 0);
  const max = Math.max(...vals, 1);
  let mejor = null; vals.forEach((x, i) => { if (x && (!mejor || x > mejor.v)) mejor = { d: i + 1, v: x }; });
  // por día de la semana (promedio por día con ventas)
  const wd = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'], ws = Array(7).fill(0), wn = Array(7).fill(0);
  Object.entries(A.porDia).forEach(([f, x]) => { const i = (D(f).getDay() + 6) % 7; ws[i] += x; wn[i]++; });
  const wp = ws.map((s, i) => wn[i] ? s / wn[i] : 0), wmax = Math.max(...wp, 1);

  v.innerHTML = `<div class="toolbar"><input type="month" id="r-mes" value="${mesRes}" aria-label="Mes">
    <button class="btn sm" type="button" id="r-print">Imprimir</button><button class="btn sm" type="button" id="r-csv">Descargar Excel (CSV)</button></div>
  <div id="r-area">
  <h2 style="margin:0 0 12px;font-size:20px">${esc(mesLargo(mesRes))}</h2>
  ${!A.n ? '<div class="card empty">No hay cierres en este mes todavía.</div>' : `
  <div class="kpis">
    <div class="kpi"><span>Ventas del mes</span><b class="num">${fmt(A.ventas)}</b>${cmp == null ? '<small>Sin datos del mes anterior</small>' : `<small class="${cmp >= 0 ? 'up' : 'down'}">${cmp >= 0 ? '▲' : '▼'} ${Math.abs(cmp).toFixed(1)}% vs. mes anterior</small>`}</div>
    <div class="kpi"><span>Promedio por día</span><b class="num">${fmt(prom)}</b><small>${A.dias} día${A.dias === 1 ? '' : 's'} con cierre</small></div>
    <div class="kpi"><span>Mejor día</span><b class="num">${mejor ? fmt(mejor.v) : '—'}</b><small>${mejor ? esc(fechaLarga(mesRes + '-' + String(mejor.d).padStart(2, '0'))) : ''}</small></div>
    <div class="kpi"><span>Diferencias de caja</span><b class="num ${A.sob - A.fal < -0.5 ? 'down' : ''}">${signed(A.sob - A.fal)}</b><small>Faltantes ${fmt(A.fal)} (${A.nFal}) · sobrantes ${fmt(A.sob)}</small></div>
  </div>

  <section class="card"><h2>Ventas por forma de pago</h2>
    <div class="stack">${pagos.map((p, i) => `<i style="width:${Math.max(0, p.v) / totPagos * 100}%;background:${COLORES[i % 6]}" title="${esc(p.l)}"></i>`).join('')}</div>
    ${pagos.map((p, i) => `<div class="mrow"><span class="dot" style="background:${COLORES[i % 6]}"></span><span>${esc(p.l)}</span><b class="num">${fmt(p.v)}</b><span class="p">${(Math.max(0, p.v) / totPagos * 100).toFixed(1)}%</span></div>`).join('')}
    <div class="mrow" style="border:0"><span></span><b>Total</b><b class="num">${fmt(A.ventas)}</b><span></span></div>
    ${CFG.abonos ? `<p class="note">Además entraron ${fmt(A.abonos)} en abonos de clientes. ${A.medios.credito != null ? `Se fió ${fmt(A.medios.credito)} y se cobró ${fmt(A.abonos)}: el crédito en la calle ${A.medios.credito - A.abonos >= 0 ? 'subió' : 'bajó'} ${fmt(Math.abs(A.medios.credito - A.abonos))}.` : ''}</p>` : ''}
  </section>

  <section class="card"><h2>Ventas por día</h2>
    <div class="days">${vals.map((x, i) => `<div title="${i + 1}: ${fmt(x)}"><i class="${x ? '' : 'none'}" style="height:${x / max * 100}%"></i></div>`).join('')}</div>
    <div class="dlabels">${vals.map((_, i) => `<span>${(i + 1) % 5 === 0 || i === 0 ? i + 1 : ''}</span>`).join('')}</div>
    <p class="note">Barra más alta = ${fmt(max)}</p>
  </section>

  <section class="card"><h2>Promedio por día de la semana</h2>
    ${wd.map((n, i) => `<div class="wk"><span>${n}</span><div class="tr"><i style="width:${wp[i] / wmax * 100}%"></i></div><b class="num">${wn[i] ? fmt(wp[i]) : '—'}</b></div>`).join('')}
    <p class="note">Sirve para ver qué días conviene reforzar personal, promociones o compras.</p>
  </section>

  ${CANCHAS ? `<section class="card"><h2>Canchas</h2>
    ${CFG.canchas.map(c => { const x = A.canchas[c.id] || { h: 0, m: 0 }; return `<div class="mrow" style="grid-template-columns:1fr auto auto"><span>${esc(c.label)}</span><span class="p">${x.h} h</span><b class="num">${fmt(x.m)}</b></div>`; }).join('')}
    <div class="mrow" style="grid-template-columns:1fr auto auto"><span>De día</span><span class="p">${A.horario.dia.h} h</span><b class="num">${fmt(A.horario.dia.m)}</b></div>
    <div class="mrow" style="grid-template-columns:1fr auto auto"><span>De noche</span><span class="p">${A.horario.noche.h} h</span><b class="num">${fmt(A.horario.noche.m)}</b></div>
    ${CFG.ventasExtra.map(x => `<div class="mrow" style="grid-template-columns:1fr auto"><span>${esc(x.label)}</span><b class="num">${fmt(A.extra[x.id] || 0)}</b></div>`).join('')}

    ${A.sal ? `<div class="mrow" style="grid-template-columns:1fr auto;border:0"><b>Total</b><b class="num">${fmt(A.sal)}</b></div>` : ''}
  </section>

  ${A.faltantes.length ? `<section class="card"><h2>Días con faltante</h2>
    ${A.faltantes.sort((a, b) => a.dif - b.dif).map(f => `<button class="hitem" type="button" data-act="ver" data-id="${f.c.id}"><div class="m"><b>${esc(fechaLarga(f.c.fecha))}</b><small>${esc(f.c.turno)} · ${esc(f.c.cajero)}</small></div><div class="r"><span class="pill fal">${signed(f.dif)}</span></div></button>`).join('')}
  </section>` : ''}`}
  </div>`;
  $('#r-mes').onchange = e => { mesRes = e.target.value || hoy().slice(0, 7); renderResumen(); };
  $('#r-print').onclick = () => imprimir(`<div class="rc"><div class="rc-h"><img src="${CFG.logo}" alt=""><div><b>${esc(CFG.negocio)}</b><span>Resumen mensual</span></div></div></div>` + $('#r-area').innerHTML);

/* ---------- exportar / respaldo ---------- */
function descargar(nombre, contenido, tipo) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([contenido], { type: tipo })); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function descargarCSV(lst, nombre) {
  if (!lst.length) { toast('No hay cierres para exportar'); return; }
  const cols = ['Fecha', 'Turno', 'Cajero', 'Ventas totales', 'Ventas en efectivo', ...CFG.medios.map(m => m.label), ...(CFG.abonos ? ['Abonos'] : []),
    ...(CANCHAS ? ['Alquileres', ...CFG.ventasExtra.map(x => x.label)] : []), 'Salidas', 'Fondo', 'Efectivo contado', 'Debería haber', 'Diferencia', 'Para entregar', 'Observaciones'];
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = lst.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).map(c => { const t = calc(c); return [c.fecha, c.turno, c.cajero, t.ventas, t.ventasEf, ...CFG.medios.map(m => t.medios[m.id]), ...(CFG.abonos ? [t.abonos] : []),
    ...(CANCHAS ? [t.alq, ...CFG.ventasExtra.map(x => t.extra[x.id])] : []), t.sal, t.fondo, t.efectivo, t.esperado, Math.round(t.dif), t.entregar, c.notas].map(q).join(';'); });
  descargar(nombre, '﻿' + [cols.map(q).join(';'), ...rows].join('\r\n'), 'text/csv;charset=utf-8');
}

  </div></section>` : ''}
  <section class="card"><h2>Respaldo</h2>
    <p class="note" style="margin-top:0">Los cierres se guardan en este dispositivo. Descargue un respaldo cada semana (o guárdelo en Drive/WhatsApp) por si el celular o el navegador se borra.</p>
    <div class="btns">
      <button class="btn sm" type="button" id="a-bk">Descargar respaldo</button>
      <label class="btn sm" style="display:inline-flex;align-items:center">Restaurar respaldo<input type="file" accept=".json,application/json" id="a-rs" class="hide"></label>
      <button class="btn sm" type="button" id="a-csv">Todos los cierres (CSV)</button>
    </div>
  </section>
  <section class="card"><h2>Clave</h2><button class="btn sm" type="button" id="a-pin">Cambiar clave</button></section>
  <section class="card"><h2>Registro de cambios del administrador</h2>
    ${audit.length ? audit.slice(0, 50).map(a => `<div class="mrow" style="grid-template-columns:1fr"><span><b>${esc(a.accion)}</b> cierre del ${esc(a.fecha)} (${esc(a.turno)}) — ${esc(a.motivo)}<br><small class="note">${new Date(a.cuando).toLocaleString('es-CR')}</small></span></div>`).join('') : '<div class="empty">Sin cambios registrados.</div>'}
  </section>`;
  $$('#v-ajustes input[data-b^="S."]').forEach(inp => {
    const k = inp.dataset.b.slice(2); inp.removeAttribute('data-b');
    inp.onchange = () => { const val = parseCol(inp.value); setPath(S, k, val); inp.value = miles(val); saveCfg();
      if (k === 'fondo') { audit.unshift({ cuando: new Date().toISOString(), accion: 'Cambió el fondo a ' + fmt(val), fecha: hoy(), turno: '—', motivo: 'Ajustes' }); store('audit', audit); }
      if (!F.id) renderCierre(); toast('Guardado'); };
  });
  $('#a-bk').onclick = () => descargar(`respaldo-cierres-${CFG.id}-${hoy()}.json`, JSON.stringify({ app: 'cierre-caja', negocio: CFG.id, fecha: new Date().toISOString(), cierres, audit, ajustes: { fondo: S.fondo, tolerancia: S.tolerancia, tarifas: S.tarifas } }, null, 1), 'application/json');
  $('#a-csv').onclick = () => descargarCSV(cierres, `cierres-${CFG.id}-todos.csv`);
  $('#a-rs').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== 'cierre-caja' || d.negocio !== CFG.id || !Array.isArray(d.cierres)) throw new Error('formato');
      const nuevos = d.cierres.filter(c => !cierres.some(x => x.id === c.id));
      if (!(await confirmar('Restaurar respaldo', `El respaldo tiene ${d.cierres.length} cierres; ${nuevos.length} no están en este dispositivo y se van a agregar. Los que ya existen no se tocan.`, 'Restaurar'))) return;
      cierres = cierres.concat(nuevos); saveCierres(); toast(nuevos.length + ' cierres restaurados');
    } catch (err) { toast('Ese archivo no es un respaldo válido de este negocio'); }
    e.target.value = '';
  };
  $('#a-pin').onclick = cambiarPin;
}
function cambiarPin() {
  abrir(`<h3>Cambiar clave</h3>
    <label class="f">Clave actual<input class="pinin" id="q0" type="password" inputmode="numeric" maxlength="12"></label>
    <label class="f" style="margin-top:10px">Clave nueva<input class="pinin" id="q1" type="password" inputmode="numeric" maxlength="12"></label>
    <label class="f" style="margin-top:10px">Repita la nueva<input class="pinin" id="q2" type="password" inputmode="numeric" maxlength="12"></label>
    <div class="err" id="qe"></div>
    <div class="btns"><button class="btn" type="button" id="qn">Cancelar</button><button class="btn pri" type="button" id="qs">Cambiar</button></div>`);
  dlg.onclose = null;
  $('#qn').onclick = cerrar;
  $('#qs').onclick = async () => {
    if (await hashPin($('#q0').value.trim(), S.salt, S.alg) !== S.pin) { $('#qe').textContent = 'La clave actual no es correcta'; return; }
    const p = $('#q1').value.trim();
    if (!/^\d{4,12}$/.test(p)) { $('#qe').textContent = 'Use de 4 a 12 números'; return; }
    if (p !== $('#q2').value.trim()) { $('#qe').textContent = 'Las claves nuevas no coinciden'; return; }
    S.salt = uid(); S.alg = (window.crypto && crypto.subtle) ? 'sha' : 'fnv'; S.pin = await hashPin(p, S.salt, S.alg); saveCfg(); cerrar(); toast('Clave cambiada');
  };
}

/* ---------- inicio ---------- */
function llenarCajeros() { $('#cajeros').innerHTML = S.cajeros.map(c => `<option value="${esc(c)}">`).join(''); }
$('#neg').textContent = CFG.negocio;
F.salidas = F.salidas || []; F.alquileres = F.alquileres || []; F.extra = F.extra || {}; F.medios = F.medios || {}; F.conteo = F.conteo || {};
llenarCajeros(); pintarAdmin(); renderCierre();
</script>
</body>
</html>
